# Saint Barthélemy — uses .fr / collectivité domains; Digicel often uses digicelgroup.com paths.
domains:
  - domain: ac-guadeloupe.fr
    organization: Académie de Guadeloupe (covers Saint-Barthélemy schools)
    sector: Education
  - domain: comstbarth.fr
    organization: Collectivité de Saint-Barthélemy
    sector: Government
  - domain: dauphintelecom.com
    organization: Dauphin Telecom
    sector: Telecommunications
  - domain: mireillechoisy.clg.ac-guadeloupe.fr
    organization: Collège Mireille Choisy
    sector: Education
  - domain: saint-barth-saint-martin.gouv.fr
    organization: Préfecture de Saint-Barthélemy et Saint-Martin
    sector: Government
  - domain: saintbarth-tourisme.com
    organization: Office du Tourisme de Saint-Barthélemy
    sector: Government
  - domain: saintbarthtelecom.fr
    organization: Saint-Barth Telecom
    sector: Telecommunications
  - domain: seidn.ac-guadeloupe.fr
    organization: Service de l'Éducation des Îles du Nord
    sector: Education
  - domain: st-barths.com
    organization: Saint-Barthélemy destination portal
    sector: Government
  - domain: stbarthdigital.fr
    organization: St-Barth Digital (Collectivité FTTH programme)
    sector: Telecommunications
